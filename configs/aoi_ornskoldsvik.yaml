# Örnsköldsvik / Gottne flood AOI (EMSR841 AOI01), Sept 2025.
# AOI polygon derived from EMS areaOfInterestA (MONIT02 v1), convex hull, EPSG:4326.
# Nothing below is hardcoded in code — scripts read this file.

#where on the map do we care about?
aoi:
  name: ornskoldsvik_gottne
  ems_activation: EMSR841
  ems_aoi: AOI01
  crs: EPSG:4326
  bbox: [17.8185, 63.2614, 18.7204, 63.5458]  # W, S, E, N
  polygon_wkt: >-
    POLYGON ((18.7089 63.2614, 18.5669 63.2863, 17.9041 63.4709, 17.8361 63.4947,
    17.8332 63.4961, 17.8210 63.5033, 17.8185 63.5048, 17.8188 63.5060,
    17.9332 63.5398, 17.9650 63.5454, 17.9670 63.5458, 18.1253 63.5122,
    18.4438 63.4309, 18.4545 63.4278, 18.4808 63.4180, 18.7153 63.2692,
    18.7204 63.2639, 18.7127 63.2615, 18.7089 63.2614))

event:
  # Riverine flood, Moälven catchment; peak ~Sept 7-11 2025
  window_pre: ["2025-08-20", "2025-09-06"]
  window_during: ["2025-09-06", "2025-09-12"]
  window_post: ["2025-09-12", "2025-10-05"]

tracks:
  # The two EMS-label-source tracks are the spine of the POC:
  # rel 131 ASC (FEP source = S1A Sept 10 16:14) and rel 22 DESC (MONIT02 source = S1A Sept 15 05:06).
  - relative_orbit: 131
    pass: ASCENDING
  - relative_orbit: 22
    pass: DESCENDING

