[project]
name = "rawsar"
version = "0.1.0"
description = "Novel raw SAR (Sentinel-1 L0) exploration — Örnsköldsvik flood (EMSR841) proxy event"
requires-python = ">=3.11"
dependencies = [
    "xarray",
    "zarr>=3",
    "dask",
    "rioxarray",
    "geopandas",
    "shapely",
    "pyproj",
    "pystac-client",
    "sarsen",
    # 0.9.7 renamed the GRD gcp range dim slant_range_time -> ground_range, which the GCP
    # readers in grd.py, l0.py, build_zarr_store.py and label_attach_errorbars.py rely on
    "xarray-sentinel<0.9.7",
    "sentinel1decoder",
    "xbatcher",
    "matplotlib",
    "requests",
    "python-dotenv",
    "pyyaml",
    "tqdm",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyterlab",
    # Phase-5 virtual-access experiments + EOPF STAC reads
    "aiohttp",
    "kerchunk",
    "virtualizarr",
    "tifffile",
    "imagecodecs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rawsar"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# notebook builders hold long markdown prose lines
"scripts/build_nb*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
