[project]
name = "rawsar"
version = "0.1.0"
description = "Novel raw SAR (Sentinel-1 L0) exploration"
requires-python = ">=3.12"
dependencies = [
    "xarray",
    "zarr>=3",
    "dask",
    "rioxarray",
    "geopandas",
    "shapely",
    "pyproj",
    "pystac-client",
    "sarsen",
    "sentinel1decoder",
    "xbatcher",
    "matplotlib",
    "requests",
    "python-dotenv",
    "pyyaml",
    "tqdm",
    "scipy",
]
